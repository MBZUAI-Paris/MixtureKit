# Branch-Train-Stitch: the experts run next to the hub (the first expert), joined by
# stitch layers every stitch_freq blocks.
#   mixturekit build examples/configs/bts_llama.yaml
moe_method: bts
model_type: llamabts
experts:
  - {expert_name: hub, model_id: meta-llama/Llama-3.2-1B}
  - {expert_name: instruct, model_id: meta-llama/Llama-3.2-1B-Instruct}
num_experts_per_tok: 2
router_layers: []
router_layers_index: []
stitch_freq: 4
alpha: 0
