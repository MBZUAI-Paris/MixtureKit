# A Mixtral-style MoE: one router per layer over the experts' feed-forward blocks.
#   mixturekit build examples/configs/traditional_qwen3.yaml
moe_method: traditional
model_type: qwen3moe3x
num_experts_per_tok: 2
experts:
  - {expert_name: base, model_id: Qwen/Qwen3-0.6B}
  - {expert_name: base-copy-1, model_id: Qwen/Qwen3-0.6B}
  - {expert_name: base-copy-2, model_id: Qwen/Qwen3-0.6B}
router_layers: []
router_layers_index: []
alpha: 0.01
