# A Mixtral-style MoE: one router per layer over the experts' feed-forward blocks.
#   mixturekit build examples/configs/traditional_qwen3.yaml   -> models_merge/qwen3moe2x
moe_method: traditional
model_type: qwen3moe2x
num_experts_per_tok: 2
experts:
  - {expert_name: base, model_id: Qwen/Qwen3-0.6B-Base}
  - {expert_name: chat, model_id: Qwen/Qwen3-0.6B}
alpha: 0.01
