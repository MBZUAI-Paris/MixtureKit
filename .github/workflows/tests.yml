name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest and newest supported transformers versions, and a few in between
          - {python: "3.10", transformers: "4.52.4"}
          - {python: "3.11", transformers: "4.57.6"}
          - {python: "3.12", transformers: "5.0.0"}
          - {python: "3.12", transformers: "5.4.0"}
          - {python: "3.12", transformers: "5.19.0"}
    name: py${{ matrix.python }} / transformers ${{ matrix.transformers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version is read from the git tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]" "transformers==${{ matrix.transformers }}"
      - name: Run the tests
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m pytest -q
